# Pushing a version tag (v1.0.0, v1.1.0, ...) publishes a GitHub release with a ready-to-use zip.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the download zip
        run: git archive --format=zip --prefix=Minecraft-Easy-Command/ -o "Minecraft-Easy-Command-$GITHUB_REF_NAME.zip" HEAD
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Minecraft-Easy-Command-$GITHUB_REF_NAME.zip" --title "Bedrock Music Maker $GITHUB_REF_NAME" --notes-file .github/release-notes.md
