# Publishes a GitHub release with a ready-to-use zip when:
#   - the VERSION file (or this workflow) changes in a push: the release is tagged v<VERSION>
#     (skipped if that release exists already), or
#   - a version tag (v1.0.0, v1.1.0, ...) is pushed.
name: Release
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['VERSION', '.github/workflows/release.yml']   # tag pushes ignore this filter
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$(tr -d ' \r\n' < VERSION)"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Build the download zip
        run: git archive --format=zip --prefix=Minecraft-Easy-Command/ -o "Minecraft-Easy-Command-$TAG.zip" HEAD
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists: bump VERSION for a new one."; exit 0; fi
          gh release create "$TAG" "Minecraft-Easy-Command-$TAG.zip" --target "$GITHUB_SHA" --title "Bedrock Music Maker $TAG" --notes-file .github/release-notes.md
